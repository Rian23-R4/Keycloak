services:
  keycloak:
    container_name: keycloak
    build:
      context: ./../../../
      dockerfile: ./.docker/file/local/keycloak/Dockerfile
    image: keycloak:latest
    ports:
      - ${DOCKER_KEYCLOAK_BIND_PORT}:8080 # HTTP
      - ${DOCKER_KEYCLOAK_BIND_PORT_SSL}:8443 # HTTPS
    volumes:
      - ./../../data/local/keycloak/data:/opt/keycloak/data
    env_file:
      - keycloak.env
    networks:
      network:
        ipv4_address: ${DOCKER_KEYCLOAK_IP_ADDRESS}

networks:
  network:
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET}
